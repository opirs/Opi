<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورشة — محرر صور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cairo:wght@400;700&family=Almarai:wght@400;700&family=Amiri:wght@400;700&family=Lalezar&family=Changa:wght@400;700&family=Noto+Kufi+Arabic:wght@400;700&family=Roboto:wght@400;700&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Raleway:wght@400;700&family=Inter:wght@400;700&family=Courier+Prime:wght@400;700&family=Pacifico&family=Lobster&family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Permanent+Marker&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6df;--pan:#f6f4ef;--pan2:#ebe8e0;--line:#cdc8bc;--tx:#232c31;--mu:#66747b;--ac:#b9791a;--acx:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2226;--pan:#232c31;--pan2:#2c373d;--line:#34414a;--tx:#e8e4da;--mu:#8fa0a8;--ac:#e8b04a;--acx:#1b2226}}
:root[data-theme="dark"]{--bg:#1b2226;--pan:#232c31;--pan2:#2c373d;--line:#34414a;--tx:#e8e4da;--mu:#8fa0a8;--ac:#e8b04a;--acx:#1b2226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:500 14px/1.4 Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;max-width:100vw;-webkit-user-select:none;user-select:none}
button,input{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.35}
button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;background:var(--pan);border-bottom:1px solid var(--line);min-width:0;max-width:100%}
body>*{min-width:0;max-width:100%}
header h1{font-size:18px;margin:0 0 0 auto;font-weight:700}
#view{flex:1;min-height:0;display:flex;overflow:auto;touch-action:none;padding:10px}
#stage{position:relative;isolation:isolate;margin:auto;flex:none;touch-action:none;box-shadow:0 0 0 1px var(--line);background:conic-gradient(#bdbdbd 25%,#e6e6e6 0 50%,#bdbdbd 0 75%,#e6e6e6 0) 0 0/20px 20px}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#ov{z-index:999;pointer-events:none}
#marq{position:absolute;display:none;z-index:998;pointer-events:none;border:2px dashed var(--ac);box-shadow:0 0 0 1px #000;box-sizing:border-box}
.tabs{display:flex;background:var(--pan);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px}
.tabs button.on{background:none;color:var(--ac);box-shadow:inset 0 -3px 0 var(--ac)}
#panel{height:172px;overflow:auto;background:var(--pan);padding:10px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:9px}
.row label{display:flex;align-items:center;gap:6px;color:var(--mu)}
.row input[type=range]{width:110px;accent-color:var(--ac)}
input[type=color]{width:38px;height:32px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
input[type=text]{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:150px;-webkit-user-select:text;user-select:text}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid var(--line)}
input[type=number]{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:6px;width:74px}
select{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:inherit;font:inherit}
.ly{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;cursor:pointer}
.ly.on{border-color:var(--ac);background:var(--pan2)}
.ly span{flex:1}
.ly button{padding:3px 9px}
#toast{position:fixed;inset:auto 0 190px 0;margin:auto;width:max-content;max-width:90%;background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2000}
#toast.show{opacity:1}
#sv{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;z-index:3000}
#sv.show{display:flex}
#sv img{max-width:100%;max-height:60%;background:#fff;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#sv p{color:#fff;margin:0;text-align:center}
#sv a{color:var(--acx);background:var(--ac);padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:700}
#lbar{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--pan);border-top:1px solid var(--line)}
#lbar .lc{flex:none;display:flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--pan2);cursor:pointer}
#lbar .lc.on{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
#lbar .lc button{padding:2px 7px}
@media (min-width:900px){
  body{display:grid;grid-template-columns:1fr 240px;grid-template-rows:auto 1fr auto auto}
  header{grid-column:1/3}
  #view{grid-column:1;grid-row:2}
  .tabs{grid-column:1;grid-row:3}
  #panel{grid-column:1;grid-row:4;height:auto;max-height:230px}
  #lbar{grid-column:2;grid-row:2/5;flex-direction:column;overflow-y:auto;overflow-x:hidden;border-top:0;border-left:1px solid var(--line)}
  #lbar .lc{width:100%;box-sizing:border-box}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <button id="undo" aria-label="تراجع">↶ تراجع</button>
  <button id="redo" aria-label="إعادة">↷ إعادة</button>
  <button id="open">فتح صورة</button>
  <button id="save" class="on">حفظ</button>
  <h1>ورشة</h1>
  <input type="file" id="file" accept="image/*" hidden>
  <input type="file" id="pfile" accept=".warsha,.json" hidden>
</header>
<div id="view" dir="ltr"><div id="stage"><canvas id="ov"></canvas><div id="marq"></div></div></div>
<div id="lbar" aria-label="الطبقات"></div>
<div class="tabs" role="tablist">
  <button data-t="tools" class="on">الأدوات</button>
  <button data-t="layers">الطبقات</button>
  <button data-t="adjust">الضبط</button>
  <button data-t="xf">تحويل</button>
  <button data-t="col">ألوان</button>
</div>
<div id="panel">
  <section id="p-tools">
    <div class="row" id="toolrow"></div>
    <div class="row">
      <input type="color" id="col" value="#e8b04a" aria-label="اللون"><input type="color" id="col2" value="#1b2226" aria-label="اللون الثاني للتدرج"><select id="gtype" aria-label="نوع التدرج"><option value="lin">تدرج خطي</option><option value="rad">تدرج دائري</option><option value="fade">لون ← شفاف</option></select>
      <span id="sws" class="row" style="margin:0"></span>
    </div>
    <div class="row">
      <label>الحجم <input type="range" id="size" min="1" max="120" value="12"></label>
      <label>الشفافية <input type="range" id="alpha" min="5" max="100" value="100"></label>
      <label>صلابة الحواف <input type="range" id="hard" min="0" max="100" value="100"></label>
    </div>
    <div class="row">
      <textarea id="txt" rows="2" aria-label="النص" style="background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:170px;color:inherit;font:inherit;resize:none;-webkit-user-select:text;user-select:text">ورشة</textarea>
      <select id="tfont" aria-label="الخط"><option value="Tajawal,sans-serif">خط عربي</option><option value="Georgia,serif">مسنن (Serif)</option><option value="Courier New,monospace">ثابت (Mono)</option><option value="cursive">يدوي</option></select>
      <button id="t-ap">تطبيق الحجم واللون</button><button id="t-b">عريض</button><button id="t-al">محاذاة</button><button id="t-ras">تحويل لصورة</button>
      <label><input type="checkbox" id="fillshape" checked> ملء الأشكال</label>
    </div>
    <div class="row"><button id="s-all">تحديد الكل</button><button id="s-no">إلغاء التحديد</button><button id="s-del">حذف المحدد</button><button id="s-cp">نسخ لطبقة</button><label>تنعيم حواف التحديد <input type="range" id="feather" min="0" max="60" value="0"></label><button id="cl-src">مصدر الاستنساخ</button><label>تسامح العصا <input type="range" id="tol" min="0" max="120" value="32"></label><button id="z-out">تصغير</button><button id="z-in">تكبير</button>
    </div>
    <div class="row"><button id="pj-save">حفظ المشروع</button><button id="pj-load">فتح المشروع</button><button id="pj-file">تصدير ملف</button><button id="pj-imp">استيراد ملف</button>
    </div>
  </section>
  <section id="p-layers" hidden>
    <div class="row">
      <button id="l-add">إضافة</button><button id="l-dup">نسخ</button><button id="l-del">حذف</button>
      <button id="l-up">للأعلى</button><button id="l-dn">للأسفل</button><button id="l-clr">مسح</button>
    </div>
    <div class="row"><label>شفافية الطبقة <input type="range" id="lop" min="0" max="100" value="100"></label></div>
    <div class="row"><label>الدمج <select id="bm"><option value="normal">عادي</option><option value="multiply">ضرب</option><option value="screen">شاشة</option><option value="overlay">تراكب</option><option value="darken">أغمق</option><option value="lighten">أفتح</option><option value="difference">فرق</option></select></label></div>
    <div class="row"><button id="m-new">قناع جديد</button><button id="mmode">وضع القناع</button><button id="m-inv">عكس القناع</button><button id="m-app">تطبيق القناع</button><button id="m-del">حذف القناع</button></div>
    <div id="list"></div>
  </section>
  <section id="p-col" hidden>
    <div class="row"><label>ظلال <input type="range" id="lv-b" min="0" max="250" value="0"></label><label>منتصف <input type="range" id="lv-g" min="20" max="300" value="100"></label><label>إضاءات <input type="range" id="lv-w" min="5" max="255" value="255"></label></div>
    <div class="row"><label>أحمر <input type="range" id="cb-r" min="-100" max="100" value="0"></label><label>أخضر <input type="range" id="cb-g" min="-100" max="100" value="0"></label><label>أزرق <input type="range" id="cb-b" min="-100" max="100" value="0"></label></div>
    <div class="row"><select id="cv-ch"><option value="all">منحنى: الكل</option><option value="r">منحنى: أحمر</option><option value="g">منحنى: أخضر</option><option value="b">منحنى: أزرق</option></select><button id="cv-del">حذف نقطة</button><button id="cv-ok" class="on">تطبيق</button><button id="cv-rs">إعادة</button></div>
    <canvas id="cv" width="256" height="256" style="width:150px;height:150px;touch-action:none;border:1px solid var(--line);border-radius:8px"></canvas>
  </section>
  <section id="p-xf" hidden>
    <div class="row"><label>تدوير الطبقة <input type="range" id="x-r" min="-180" max="180" value="0"></label><label>حجم الطبقة <input type="range" id="x-s" min="10" max="300" value="100"></label></div>
    <div class="row"><button id="x-ok" class="on">تطبيق على الطبقة</button><button id="x-rs">إعادة</button></div>
    <div class="row"><button id="xf-ap" class="on">تطبيق التحويل الحر</button><button id="xf-cn">إلغاء التحويل</button></div>
    <div class="row"><button id="x-crop">قص للتحديد</button><button id="x-rl">تدوير الصورة ↺</button><button id="x-rr">تدوير الصورة ↻</button></div>
    <div class="row"><label>العرض <input type="number" id="x-w" min="50" max="2400"></label><label>الارتفاع <input type="number" id="x-h" min="50" max="2400"></label><button id="x-sz">تغيير الحجم</button></div>
  </section>
  <section id="p-adjust" hidden>
    <div class="row"><label>السطوع <input type="range" id="a-b" min="-100" max="100" value="0"></label>
    <label>التباين <input type="range" id="a-c" min="-100" max="100" value="0"></label></div>
    <div class="row"><label>التشبع <input type="range" id="a-s" min="-100" max="100" value="0"></label>
    <label id="blw">الضبابية <input type="range" id="a-bl" min="0" max="20" value="0"></label></div>
    <div class="row"><button id="a-ok" class="on">تطبيق</button><button id="a-rs">إعادة ضبط</button></div>
    <div class="row"><button data-f="gray">رمادي</button><button data-f="inv">عكس الألوان</button><button data-f="sepia">سيبيا</button><button data-f="flip">قلب أفقي</button></div>
    <div class="row"><select id="ftype" aria-label="الفلتر"><option value="sharp">حدة (Sharpen)</option><option value="noise">ضجيج</option><option value="pixel">بكسلة</option><option value="motion">تشويش حركة</option><option value="vig">تظليل الأطراف</option></select><select id="fdir" aria-label="الاتجاه"><option value="h">أفقي</option><option value="v">عمودي</option></select><label>الكمية <input type="range" id="famt" min="0" max="100" value="40"></label></div>
    <div class="row"><button id="f-ok" class="on">تطبيق الفلتر</button><button id="f-rs">إعادة</button></div>
  </section>
</div>
<div id="toast" role="status"></div>
<div id="sv"><p>اضغط مطولًا على الصورة لحفظها، أو استخدم أحد الروابط</p><img id="svimg" alt="الصورة النهائية"><div class="row"><a id="dlp" download="warsha.png">تنزيل PNG</a><a id="dlj" download="warsha.jpg">تنزيل JPG</a><button id="svx">إغلاق</button></div></div>

<script>
(function(){
let W=1000,H=700;const $=s=>document.querySelector(s);
const stage=$('#stage'),ov=$('#ov'),octx=ov.getContext('2d');
ov.width=W;ov.height=H;
let layers=[],act=0,uid=0,tool='brush',hist=[],redo=[],drag=null,sel=null,z=1,maskMode=false,cb=null;
const adj={b:0,c:0,s:0,bl:0},xf={r:0,s:1};
const HIDE_T=['rect','ell','tri','star','line','arrow'];
const TOOLS=[['brush','فرشاة'],['eraser','ممحاة'],['fill','تعبئة'],['move','تحريك'],['text','نص'],['rect','مستطيل'],['ell','دائرة'],['tri','مثلث'],['star','نجمة'],['line','خط'],['arrow','سهم'],['grad','تدرج'],['xform','تحويل حر'],['sel','تحديد'],['lasso','تحديد حر'],['wand','عصا سحرية'],['clone','استنساخ'],['soft','تنعيم'],['dodge','تفتيح'],['burn','تغميق'],['hand','تمرير']];
const col=()=>$('#col').value,size=()=>+$('#size').value*curPr,alpha=()=>+$('#alpha').value/100;

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1600)}
function mk(name,fill){const c=document.createElement('canvas');c.width=W;c.height=H;stage.insertBefore(c,ov);
  const L={id:++uid,name,c,x:c.getContext('2d',{willReadFrequently:true}),vis:true,op:1,bm:'normal',m:null,t:null};
  if(fill){L.x.fillStyle=fill;L.x.fillRect(0,0,W,H)}return L}
function copy(c){const t=document.createElement('canvas');t.width=W;t.height=H;t.getContext('2d').drawImage(c,0,0);return t}
function clip(c){if(!sel)return;if(sel.path)c.clip(sel.path);else{c.beginPath();c.rect(sel.x,sel.y,sel.w,sel.h);c.clip()}}
function showSel(){const m=$('#marq');if(!sel){m.style.display='none';return}m.style.left=sel.x/W*100+'%';m.style.top=sel.y/H*100+'%';m.style.width=sel.w/W*100+'%';m.style.height=sel.h/H*100+'%';m.style.display='block'}
function sync(){layers.forEach((L,i)=>{L.c.style.zIndex=i;L.c.style.opacity=L.vis?L.op:0;L.c.style.mixBlendMode=L.bm})}
function snap(){return{act,W,H,layers:layers.map(L=>({id:L.id,name:L.name,vis:L.vis,op:L.op,bm:L.bm,t:L.t?{...L.t}:null,m:L.m?copy(L.m):null,c:copy(L.c)}))}}
function restore(s){layers.forEach(L=>L.c.remove());W=s.W;H=s.H;ov.width=W;ov.height=H;fit();
  layers=s.layers.map(o=>{const L=mk(o.name);L.id=o.id;L.vis=o.vis;L.op=o.op;L.x.drawImage(o.c,0,0);L.bm=o.bm||'normal';L.t=o.t?{...o.t}:null;if(o.m){L.m=copy(o.m);applyMask(L)}return L});
  act=Math.min(s.act,layers.length-1);sync();resetAdj();ui()}
function push(){hist.push(snap());if(hist.length>12)hist.shift();redo=[];ui()}
function undo(){if(hist.length>1){redo.push(hist.pop());restore(hist[hist.length-1])}}
function redoF(){if(redo.length){const s=redo.pop();hist.push(s);restore(s)}}

function ui(){
  $('#x-w').value=W;$('#x-h').value=H;$('#undo').disabled=hist.length<2;$('#redo').disabled=!redo.length;
  renderBar();const list=$('#list');list.textContent='';
  for(let i=layers.length-1;i>=0;i--){const L=layers[i];
    const d=document.createElement('div');d.className='ly'+(i===act?' on':'');
    const eye=document.createElement('button');eye.textContent=L.vis?'ظاهرة':'مخفية';
    eye.onclick=e=>{e.stopPropagation();L.vis=!L.vis;sync();ui()};
    const n=document.createElement('span');n.textContent=L.name+(L.m?' ▣':'')+(L.t?' T':'');
    d.append(n,eye);d.onclick=()=>{act=i;resetAdj();ui()};list.append(d)}
  const L=layers[act];if(L){$('#lop').value=Math.round(L.op*100);$('#bm').value=L.bm;if(L.t){$('#txt').value=L.t.s;$('#tfont').value=L.t.f}$('#mmode').classList.toggle('on',maskMode&&!!L.m)}
}
function resetAdj(){adj.b=adj.c=adj.s=adj.bl=0;['b','c','s','bl'].forEach(k=>$('#a-'+k).value=0);xf.r=0;xf.s=1;$('#x-r').value=0;$('#x-s').value=100;layers.forEach(L=>L.c.style.transform='');prev();cancelCol();cancelX()}
function cssf(){const k=stage.clientWidth/W;return`brightness(${1+adj.b/100}) contrast(${1+adj.c/100}) saturate(${1+adj.s/100}) blur(${adj.bl*k}px)`}
function prev(){layers.forEach((L,i)=>L.c.style.filter=i===act&&(adj.b||adj.c||adj.s||adj.bl)?cssf():'')}

function fit(){const v=$('#view'),s=Math.min((v.clientWidth-20)/W,(v.clientHeight-20)/H)*z;
  stage.style.width=Math.max(50,W*s)+'px';stage.style.height=Math.max(35,H*s)+'px';prev()}
new ResizeObserver(fit).observe($('#view'));

const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function pt(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}

function fill(L,p){
  const x0=Math.floor(p.x),y0=Math.floor(p.y);if(x0<0||y0<0||x0>=W||y0>=H)return false;
  const im=L.x.getImageData(0,0,W,H),d=im.data,i0=(y0*W+x0)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]],[r,g,b]=hex(col());
  const seen=new Uint8Array(W*H),tol=40,st=[x0,y0];
  const ok=i=>Math.abs(d[i]-t[0])<=tol&&Math.abs(d[i+1]-t[1])<=tol&&Math.abs(d[i+2]-t[2])<=tol&&Math.abs(d[i+3]-t[3])<=tol;
  while(st.length){const y=st.pop(),x=st.pop();if(seen[y*W+x]||!ok((y*W+x)*4))continue;
    let xl=x,xr=x;
    while(xl>0&&!seen[y*W+xl-1]&&ok((y*W+xl-1)*4))xl--;
    while(xr<W-1&&!seen[y*W+xr+1]&&ok((y*W+xr+1)*4))xr++;
    for(let k=xl;k<=xr;k++){const j=y*W+k;seen[j]=1;d[j*4]=r;d[j*4+1]=g;d[j*4+2]=b;d[j*4+3]=255;
      if(y>0&&!seen[j-W])st.push(k,y-1);if(y<H-1&&!seen[j+W])st.push(k,y+1)}}
  L.x.putImageData(im,0,0);return true}

function wand(L,p){
  const x0=Math.floor(p.x),y0=Math.floor(p.y);if(x0<0||y0<0||x0>=W||y0>=H)return;

function newDoc(w,h){layers.forEach(L=>L.t=null);W=w;H=h;ov.width=w;ov.height=h;sel=null;showSel();resetAdj();fit();push()}
$('#x-crop').onclick=()=>{if(!sel){toast('حدد منطقة بأداة التحديد أولًا');return}
  bakeAll();const x=Math.round(sel.x),y=Math.round(sel.y),w=Math.round(sel.w),h=Math.round(sel.h);
  layers.forEach(L=>{const t=copy(L.c);L.c.width=w;L.c.height=h;L.x.drawImage(t,-x,-y)});newDoc(w,h)};
$('#x-sz').onclick=()=>{bakeAll();const w=Math.min(2400,Math.max(50,+$('#x-w').value|0)),h=Math.min(2400,Math.max(50,+$('#x-h').value|0));
  layers.forEach(L=>{const t=copy(L.c);L.c.width=w;L.c.height=h;L.x.drawImage(t,0,0,W,H,0,0,w,h)});newDoc(w,h)};
function rot90(d){bakeAll();const nw=H,nh=W;
  layers.forEach(L=>{const t=copy(L.c);L.c.width=nw;L.c.height=nh;L.x.save();L.x.translate(nw/2,nh/2);L.x.rotate(d*Math.PI/2);L.x.drawImage(t,-W/2,-H/2);L.x.restore()});newDoc(nw,nh)}
$('#x-rl').onclick=()=>rot90(-1);$('#x-rr').onclick=()=>rot90(1);
// تحديد وتكبير
$('#s-all').onclick=()=>{sel={x:0,y:0,w:W,h:H};showSel()};
$('#s-no').onclick=()=>{sel=null;showSel()};
$('#s-del').onclick=()=>{if(!sel){toast('حدد منطقة أولًا');return}{const c=layers[act].x,m=selMask();c.save();c.globalCompositeOperation='destination-out';c.drawImage(m,0,0);c.restore();push()}};
$('#s-cp').onclick=()=>{if(!sel){toast('حدد منطقة أولًا');return}const L=layers[act],N=mk('تحديد');N.x.drawImage(L.c,0,0);N.x.globalCompositeOperation='destination-in';N.x.drawImage(selMask(),0,0);N.x.globalCompositeOperation='source-over';layers.push(N);act=layers.length-1;sync();push()};
$('#z-in').onclick=()=>{z=Math.min(6,z*1.5);fit()};
$('#z-out').onclick=()=>{z=Math.max(1,z/1.5);fit()};
// فتح وحفظ
$('#open').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;
  const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(W/im.width,H/im.height),w=im.width*s,h=im.height*s;
    const L=mk(f.name.replace(/\.[^.]+$/,'').slice(0,18)||'صورة');L.x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    layers.push(L);act=layers.length-1;sync();push();URL.revokeObjectURL(u);toast('تمت إضافة الصورة كطبقة جديدة')};
  im.onerror=()=>toast('تعذر فتح هذا الملف، جرّب صورة PNG أو JPG');
  im.src=u;e.target.value=''};
$('#save').onclick=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  layers.forEach(L=>{if(!L.vis)return;let s=L.c;if(L.m){s=copy(L.c);const t=s.getContext('2d');t.globalCompositeOperation='destination-in';t.drawImage(L.m,0,0)}x.globalAlpha=L.op;x.globalCompositeOperation=L.bm==='normal'?'source-over':L.bm;x.drawImage(s,0,0)});x.globalCompositeOperation='source-over';x.globalAlpha=1;
  const p=c.toDataURL('image/png');$('#svimg').src=p;$('#dlp').href=p;$('#dlj').href=c.toDataURL('image/jpeg',.92);$('#sv').classList.add('show')};
$('#svx').onclick=()=>$('#sv').classList.remove('show');
$('#undo').onclick=undo;$('#redo').onclick=redoF;
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redoF():undo()}});

initFonts();layers.push(mk('الخلفية','#ffffff'));sync();hist.push(snap());ui();fit();
})();
</script>
</body>
</html>
